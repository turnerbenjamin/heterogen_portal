all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: true
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/turnerbenjamin/heterogen_portal:
    config:
      all: true
  github.com/turnerbenjamin/querystack:
    config:
      dir: internal/services
      filename: querystack_mocks_test.go
      pkgname: services
    interfaces:
      QueryExecutor: {}
  github.com/turnerbenjamin/querystack/querymodel:
    config:
      dir: internal/services
      filename: querymodel_mocks_test.go
      pkgname: services
    interfaces:
      AccessPolicy: {}
      Repository: {}
